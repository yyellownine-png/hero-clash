services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hero_clash
      POSTGRES_USER: hero_clash
      POSTGRES_PASSWORD: change_this_password
    volumes:
      - hero_clash_pg:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hero_clash -d hero_clash"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
volumes:
  hero_clash_pg:
